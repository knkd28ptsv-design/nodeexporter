---
- name: Install Node Exporter on Linux servers
  hosts: all
  become: true
  gather_facts: true

  vars:
    node_exporter_version: "1.9.1"
    node_exporter_port: 9100

    temp_dir: "/tmp/node_exporter_install"
    archive: "/tmp/node_exporter_install/node_exporter.tar.gz"
    extract_dir: "/tmp/node_exporter_install/extracted"

    install_dir: "/usr/local/bin"
    binary: "/usr/local/bin/node_exporter"

    service_file: "/etc/systemd/system/node_exporter.service"

  tasks:

    # ============================================================
    # SERVER INFORMATION
    # ============================================================

    - name: Display target server
      ansible.builtin.debug:
        msg:
          - "Server: {{ inventory_hostname }}"
          - "IP: {{ ansible_host | default(inventory_hostname) }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"


    # ============================================================
    # VERIFY ROOT
    # ============================================================

    - name: Check effective user
      ansible.builtin.command:
        cmd: whoami
      register: effective_user
      changed_when: false

    - name: Check effective UID
      ansible.builtin.command:
        cmd: id
      register: effective_id
      changed_when: false

    - name: Display effective privilege
      ansible.builtin.debug:
        msg:
          - "Ansible effective user: {{ effective_user.stdout }}"
          - "Ansible effective identity: {{ effective_id.stdout }}"


    # ============================================================
    # FAIL IF NOT ROOT
    # ============================================================

    - name: Verify Ansible is running as root
      ansible.builtin.assert:
        that:
          - effective_user.stdout | trim == "root"
        fail_msg:
          - "Ansible is NOT running as root."
          - "Effective user: {{ effective_user.stdout }}"
          - "Effective ID: {{ effective_id.stdout }}"
        success_msg: "Ansible is running as root."


    # ============================================================
    # CHECK SYSTEM DIRECTORIES
    # ============================================================

    - name: Check /usr/local/bin
      ansible.builtin.command:
        cmd: ls -ld /usr/local/bin
      register: usr_local_bin
      changed_when: false

    - name: Check systemd directory
      ansible.builtin.command:
        cmd: ls -ld /etc/systemd/system
      register: systemd_directory
      changed_when: false

    - name: Display system directories
      ansible.builtin.debug:
        msg:
          - "/usr/local/bin: {{ usr_local_bin.stdout }}"
          - "/etc/systemd/system: {{ systemd_directory.stdout }}"


    # ============================================================
    # CREATE TEMP DIRECTORY
    # ============================================================

    - name: Create temporary installation directory
      ansible.builtin.file:
        path: "{{ temp_dir }}"
        state: directory
        mode: "0755"


    - name: Create extraction directory
      ansible.builtin.file:
        path: "{{ extract_dir }}"
        state: directory
        mode: "0755"


    # ============================================================
    # DOWNLOAD NODE EXPORTER
    # ============================================================

    - name: Download Node Exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "{{ archive }}"
        mode: "0644"
        timeout: 120


    # ============================================================
    # EXTRACT
    # ============================================================

    - name: Extract Node Exporter
      ansible.builtin.unarchive:
        src: "{{ archive }}"
        dest: "{{ extract_dir }}"
        remote_src: true
        extra_opts:
          - "--strip-components=1"


    # ============================================================
    # VERIFY EXTRACTED BINARY
    # ============================================================

    - name: Check extracted Node Exporter
      ansible.builtin.stat:
        path: "{{ extract_dir }}/node_exporter"
      register: extracted_binary

    - name: Verify extracted binary
      ansible.builtin.assert:
        that:
          - extracted_binary.stat.exists
        fail_msg: "Node Exporter binary was not extracted."


    # ============================================================
    # CREATE /USR/LOCAL/BIN
    # ============================================================

    - name: Ensure /usr/local/bin exists
      ansible.builtin.command:
        cmd: mkdir -p /usr/local/bin
      changed_when: false


    # ============================================================
    # COPY BINARY USING ROOT COMMAND
    # ============================================================

    - name: Install Node Exporter binary
      ansible.builtin.command:
        cmd: >
          cp {{ extract_dir }}/node_exporter {{ binary }}
      args:
        creates: "{{ binary }}"


    - name: Set Node Exporter binary permissions
      ansible.builtin.command:
        cmd: chmod 0755 {{ binary }}


    - name: Set Node Exporter binary ownership
      ansible.builtin.command:
        cmd: chown root:root {{ binary }}


    # ============================================================
    # VERIFY BINARY
    # ============================================================

    - name: Verify installed Node Exporter binary
      ansible.builtin.command:
        cmd: "{{ binary }} --version"
      register: node_exporter_version_output
      changed_when: false

    - name: Display Node Exporter version
      ansible.builtin.debug:
        msg: "{{ node_exporter_version_output.stdout }}"


    # ============================================================
    # CREATE SYSTEMD SERVICE
    # ============================================================

    - name: Create Node Exporter systemd service using shell
      ansible.builtin.shell:
        cmd: |
          cat > {{ service_file }} <<'EOF'
          [Unit]
          Description=Prometheus Node Exporter
          Documentation=https://github.com/prometheus/node_exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/node_exporter --web.listen-address=0.0.0.0:9100
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          EOF

          chmod 0644 {{ service_file }}
          chown root:root {{ service_file }}
      args:
        executable: /bin/bash
      notify: Restart Node Exporter


    # ============================================================
    # RELOAD SYSTEMD
    # ============================================================

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true


    # ============================================================
    # ENABLE SERVICE
    # ============================================================

    - name: Enable Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true


    # ============================================================
    # START SERVICE
    # ============================================================

    - name: Start Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: started


    # ============================================================
    # CHECK SERVICE
    # ============================================================

    - name: Get Node Exporter service status
      ansible.builtin.systemd:
        name: node_exporter
      register: node_exporter_service


    - name: Display service status
      ansible.builtin.debug:
        msg:
          - "Service state: {{ node_exporter_service.status.ActiveState }}"
          - "Service enabled: {{ node_exporter_service.status.UnitFileState }}"


    # ============================================================
    # WAIT FOR PORT 9100
    # ============================================================

    - name: Wait for Node Exporter
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ node_exporter_port }}"
        state: started
        timeout: 20


    # ============================================================
    # CHECK METRICS
    # ============================================================

    - name: Check Node Exporter metrics
      ansible.builtin.uri:
        url: "http://127.0.0.1:9100/metrics"
        method: GET
        status_code: 200
        timeout: 10
      register: metrics_result


    - name: Display metrics result
      ansible.builtin.debug:
        msg: "Node Exporter metrics endpoint is working."


    # ============================================================
    # FIREWALL
    # ============================================================

    - name: Check firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --state
      register: firewalld_status
      changed_when: false
      failed_when: false


    - name: Open Node Exporter port
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --add-port=9100/tcp
      register: firewall_result
      changed_when: "'success' in firewall_result.stdout"
      when:
        - firewalld_status.rc == 0
        - firewalld_status.stdout | trim == "running"


    - name: Reload firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      when:
        - firewalld_status.rc == 0
        - firewalld_status.stdout | trim == "running"
        - firewall_result is defined
        - firewall_result.changed


    # ============================================================
    # CLEANUP
    # ============================================================

    - name: Remove temporary installation directory
      ansible.builtin.file:
        path: "{{ temp_dir }}"
        state: absent


    # ============================================================
    # FINAL RESULT
    # ============================================================

    - name: Final Node Exporter status
      ansible.builtin.systemd:
        name: node_exporter
      register: final_status


    - name: Display final result
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NODE EXPORTER INSTALLATION COMPLETED"
          - "============================================================"
          - "Server      : {{ inventory_hostname }}"
          - "IP          : {{ ansible_host | default(inventory_hostname) }}"
          - "OS          : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Version     : {{ node_exporter_version }}"
          - "Binary      : {{ binary }}"
          - "Port        : {{ node_exporter_port }}"
          - "Service     : {{ final_status.status.ActiveState }}"
          - "Metrics     : http://{{ ansible_host | default(inventory_hostname) }}:9100/metrics"
          - "============================================================"


  # ============================================================
  # HANDLER
  # ============================================================

  handlers:

    - name: Restart Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true
