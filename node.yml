---
- name: Install Node Exporter on any Linux server
  hosts: all
  become: true
  gather_facts: true

  vars:
    node_exporter_version: "1.9.1"
    node_exporter_port: 9100

    # Use /tmp because it is already proven writable on your server
    node_exporter_install_dir: "/tmp/node_exporter"
    node_exporter_binary: "/tmp/node_exporter/node_exporter"

    node_exporter_archive: "/tmp/node_exporter.tar.gz"
    node_exporter_extract_dir: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"

  tasks:

    # ============================================================
    # SERVER INFORMATION
    # ============================================================

    - name: Display target server information
      ansible.builtin.debug:
        msg:
          - "Server: {{ inventory_hostname }}"
          - "IP: {{ ansible_host | default(inventory_hostname) }}"
          - "Operating System: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"


    # ============================================================
    # VERIFY ARCHITECTURE
    # ============================================================

    - name: Verify supported architecture
      ansible.builtin.assert:
        that:
          - ansible_architecture in ['x86_64', 'amd64']
        fail_msg: >
          Unsupported architecture {{ ansible_architecture }}.
          This playbook currently supports x86_64/amd64 only.


    # ============================================================
    # VERIFY EFFECTIVE PRIVILEGE
    # ============================================================

    - name: Check effective Ansible user
      ansible.builtin.command:
        cmd: whoami
      register: effective_user
      changed_when: false

    - name: Check effective Ansible identity
      ansible.builtin.command:
        cmd: id
      register: effective_id
      changed_when: false

    - name: Display effective privilege
      ansible.builtin.debug:
        msg:
          - "Effective user: {{ effective_user.stdout }}"
          - "Effective identity: {{ effective_id.stdout }}"


    # ============================================================
    # CREATE INSTALLATION DIRECTORY
    # ============================================================

    - name: Create Node Exporter installation directory
      ansible.builtin.file:
        path: "{{ node_exporter_install_dir }}"
        state: directory
        mode: "0755"


    # ============================================================
    # CHECK EXISTING NODE EXPORTER
    # ============================================================

    - name: Check whether Node Exporter already exists
      ansible.builtin.stat:
        path: "{{ node_exporter_binary }}"
      register: node_exporter_binary_check


    # ============================================================
    # DOWNLOAD
    # ============================================================

    - name: Download Node Exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "{{ node_exporter_archive }}"
        mode: "0644"
        timeout: 120
      when: not node_exporter_binary_check.stat.exists


    # ============================================================
    # EXTRACT
    # ============================================================

    - name: Extract Node Exporter
      ansible.builtin.unarchive:
        src: "{{ node_exporter_archive }}"
        dest: "/tmp"
        remote_src: true
      when: not node_exporter_binary_check.stat.exists


    # ============================================================
    # INSTALL BINARY
    # ============================================================

    - name: Copy Node Exporter binary
      ansible.builtin.copy:
        src: "{{ node_exporter_extract_dir }}/node_exporter"
        dest: "{{ node_exporter_binary }}"
        remote_src: true
        mode: "0755"
      when: not node_exporter_binary_check.stat.exists
      notify: Restart Node Exporter


    # ============================================================
    # VERIFY BINARY
    # ============================================================

    - name: Check Node Exporter binary
      ansible.builtin.stat:
        path: "{{ node_exporter_binary }}"
      register: installed_node_exporter


    - name: Verify Node Exporter binary exists
      ansible.builtin.assert:
        that:
          - installed_node_exporter.stat.exists
          - installed_node_exporter.stat.executable
        fail_msg: "Node Exporter binary was not installed correctly."


    # ============================================================
    # CREATE SYSTEMD SERVICE
    # ============================================================

    - name: Create Node Exporter systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Documentation=https://github.com/prometheus/node_exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple

          ExecStart=/tmp/node_exporter/node_exporter \
            --web.listen-address=0.0.0.0:9100

          Restart=on-failure
          RestartSec=5

          NoNewPrivileges=true
          PrivateTmp=false

          [Install]
          WantedBy=multi-user.target
      notify: Restart Node Exporter


    # ============================================================
    # RELOAD SYSTEMD
    # ============================================================

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true


    # ============================================================
    # ENABLE SERVICE
    # ============================================================

    - name: Enable Node Exporter service
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true


    # ============================================================
    # START SERVICE
    # ============================================================

    - name: Start Node Exporter service
      ansible.builtin.systemd:
        name: node_exporter
        state: started


    # ============================================================
    # CHECK SERVICE
    # ============================================================

    - name: Get Node Exporter service status
      ansible.builtin.systemd:
        name: node_exporter
      register: node_exporter_service


    - name: Display Node Exporter service status
      ansible.builtin.debug:
        msg:
          - "Node Exporter service state: {{ node_exporter_service.status.ActiveState }}"
          - "Node Exporter service enabled: {{ node_exporter_service.status.UnitFileState }}"


    # ============================================================
    # WAIT FOR PORT 9100
    # ============================================================

    - name: Wait for Node Exporter port 9100
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ node_exporter_port }}"
        state: started
        timeout: 20


    # ============================================================
    # CHECK METRICS
    # ============================================================

    - name: Check Node Exporter metrics endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
        method: GET
        status_code: 200
        timeout: 10
      register: metrics_check


    - name: Display metrics status
      ansible.builtin.debug:
        msg: "Node Exporter metrics endpoint is responding successfully."


    # ============================================================
    # CHECK FIREWALL
    # ============================================================

    - name: Check firewalld status
      ansible.builtin.command:
        cmd: firewall-cmd --state
      register: firewalld_status
      changed_when: false
      failed_when: false


    - name: Allow TCP 9100 through firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --add-port=9100/tcp
      register: firewall_add
      changed_when: "'success' in firewall_add.stdout"
      when:
        - firewalld_status.rc == 0
        - firewalld_status.stdout | trim == "running"


    - name: Reload firewalld
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      when:
        - firewalld_status.rc == 0
        - firewalld_status.stdout | trim == "running"
        - firewall_add is defined
        - firewall_add.changed


    # ============================================================
    # CLEANUP DOWNLOAD FILES
    # ============================================================

    - name: Remove downloaded Node Exporter archive
      ansible.builtin.file:
        path: "{{ node_exporter_archive }}"
        state: absent


    - name: Remove extracted Node Exporter directory
      ansible.builtin.file:
        path: "{{ node_exporter_extract_dir }}"
        state: absent


    # ============================================================
    # FINAL VALIDATION
    # ============================================================

    - name: Get final service status
      ansible.builtin.systemd:
        name: node_exporter
      register: final_node_exporter_status


    - name: Node Exporter installation completed
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "NODE EXPORTER INSTALLATION COMPLETED"
          - "============================================================"
          - "Server       : {{ inventory_hostname }}"
          - "IP           : {{ ansible_host | default(inventory_hostname) }}"
          - "OS           : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture : {{ ansible_architecture }}"
          - "Version      : {{ node_exporter_version }}"
          - "Binary       : {{ node_exporter_binary }}"
          - "Port         : {{ node_exporter_port }}"
          - "Service      : node_exporter"
          - "Service      : {{ final_node_exporter_status.status.ActiveState }}"
          - "Metrics URL  : http://{{ ansible_host | default(inventory_hostname) }}:9100/metrics"
          - "============================================================"


  # ============================================================
  # HANDLERS
  # ============================================================

  handlers:

    - name: Restart Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true
