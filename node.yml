---
- name: Install and configure Prometheus Node Exporter
  hosts: all
  become: true
  gather_facts: true

  vars:
    node_exporter_version: "1.9.1"
    node_exporter_user: "node_exporter"
    node_exporter_port: 9100
    node_exporter_install_dir: "/usr/local/bin"
    node_exporter_archive: "/tmp/node_exporter.tar.gz"

  tasks:

    # ============================================================
    # SYSTEM INFORMATION
    # ============================================================

    - name: Display target server
      ansible.builtin.debug:
        msg:
          - "Installing Node Exporter on {{ inventory_hostname }}"
          - "IP Address: {{ ansible_host | default(inventory_hostname) }}"
          - "Operating System: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"


    # ============================================================
    # CREATE NODE EXPORTER USER
    # ============================================================

    - name: Create node_exporter user
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present


    # ============================================================
    # DOWNLOAD NODE EXPORTER
    # ============================================================

    - name: Download Node Exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "{{ node_exporter_archive }}"
        mode: "0644"
        timeout: 60


    # ============================================================
    # EXTRACT NODE EXPORTER
    # ============================================================

    - name: Extract Node Exporter
      ansible.builtin.unarchive:
        src: "{{ node_exporter_archive }}"
        dest: "/tmp"
        remote_src: true
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"


    # ============================================================
    # INSTALL NODE EXPORTER BINARY
    # ============================================================

    - name: Install Node Exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "{{ node_exporter_install_dir }}/node_exporter"
        remote_src: true
        owner: root
        group: root
        mode: "0755"


    # ============================================================
    # CREATE SYSTEMD SERVICE
    # ============================================================

    - name: Create Node Exporter systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Documentation=https://github.com/prometheus/node_exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=simple
          User=node_exporter
          Group=node_exporter

          ExecStart=/usr/local/bin/node_exporter \
            --web.listen-address=0.0.0.0:9100

          Restart=on-failure
          RestartSec=5

          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target


    # ============================================================
    # START NODE EXPORTER
    # ============================================================

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true


    - name: Enable Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true


    - name: Start Node Exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: started


    # ============================================================
    # CHECK SERVICE
    # ============================================================

    - name: Check Node Exporter service
      ansible.builtin.systemd:
        name: node_exporter
      register: node_exporter_service


    - name: Display Node Exporter service status
      ansible.builtin.debug:
        msg:
          - "Node Exporter service: {{ node_exporter_service.status.ActiveState }}"
          - "Node Exporter enabled: {{ node_exporter_service.status.UnitFileState }}"


    # ============================================================
    # CHECK PORT 9100
    # ============================================================

    - name: Check Node Exporter port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ node_exporter_port }}"
        timeout: 10
        state: started


    # ============================================================
    # CHECK METRICS ENDPOINT
    # ============================================================

    - name: Check Node Exporter metrics endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
        method: GET
        status_code: 200
        return_content: false
      register: node_exporter_metrics


    # ============================================================
    # FIREWALL
    # ============================================================

    - name: Check if firewalld is installed
      ansible.builtin.command:
        cmd: firewall-cmd --state
      register: firewalld_state
      failed_when: false
      changed_when: false


    - name: Allow Node Exporter port through firewalld
      ansible.posix.firewalld:
        port: "{{ node_exporter_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      when:
        - firewalld_state.rc == 0
        - firewalld_state.stdout == "running"


    # ============================================================
    # CLEANUP
    # ============================================================

    - name: Remove downloaded archive
      ansible.builtin.file:
        path: "{{ node_exporter_archive }}"
        state: absent


    - name: Remove extracted Node Exporter directory
      ansible.builtin.file:
        path: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"
        state: absent


    # ============================================================
    # FINAL RESULT
    # ============================================================

    - name: Node Exporter installation completed
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "Node Exporter installation completed"
          - "============================================================"
          - "Server       : {{ inventory_hostname }}"
          - "IP           : {{ ansible_host | default(inventory_hostname) }}"
          - "Version      : {{ node_exporter_version }}"
          - "Port         : {{ node_exporter_port }}"
          - "Service      : node_exporter"
          - "Metrics URL  : http://{{ ansible_host | default(inventory_hostname) }}:9100/metrics"
          - "Status       : {{ node_exporter_service.status.ActiveState }}"
          - "============================================================"
